<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeCare — мобильная версия</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F4F4;--bg2:#fff;--t1:#111;--t2:#6D7885;--t3:#798BA5;--t4:#D4D4D4;--ac:#205EFF;--btn:#205EFF;--ok:#16A750;--okbg:#D6FFE6;--dg:#EB5757;--dgbg:#FFF1F1;--sec:#EAF1FD;--secp:#CADDFF;--ter:#EBEBEB;--line:#ECECEC;--on:#2DD06E;--off:#B9BDC9;--stage:#E3E6EC;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F12;--bg2:#1A1C21;--t1:#F2F3F5;--t2:#9AA4B2;--t3:#8393AD;--t4:#4A4F58;--ac:#6B93FF;--ok:#3DD17A;--okbg:#12301F;--dg:#FF7B7B;--dgbg:#3A1C1C;--sec:#1B2742;--secp:#2A3F6E;--ter:#2A2D33;--line:#2A2D33;--off:#4A4F5C;--stage:#050506;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F12;--bg2:#1A1C21;--t1:#F2F3F5;--t2:#9AA4B2;--t3:#8393AD;--t4:#4A4F58;--ac:#6B93FF;--ok:#3DD17A;--okbg:#12301F;--dg:#FF7B7B;--dgbg:#3A1C1C;--sec:#1B2742;--secp:#2A3F6E;--ter:#2A2D33;--line:#2A2D33;--off:#4A4F5C;--stage:#050506;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:400 14px/20px "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t1);background:var(--stage);display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.phone{width:390px;height:min(844px,100dvh);background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
@media(max-width:430px){.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
.top{padding:20px 16px 4px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;gap:8px}
.bar b{flex:1;font:500 18px/24px inherit}
.av{width:36px;height:36px;border-radius:50%;background:var(--sec);color:var(--ac);font-weight:500;font-size:16px}
.av[aria-current=page]{box-shadow:0 0 0 2px var(--ac)}
.th{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:var(--bg2)}
h1{font:500 26px/32px inherit}
.sub{color:var(--t2);margin-top:2px}
main{flex:1;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
h2{font:500 16px/24px inherit}
.mut{color:var(--t2)}.sm{font-size:13px;line-height:18px}.sec{color:var(--t3)}
.big{font:500 26px/32px inherit}
.ok{color:var(--ok)}.dg{color:var(--dg)}
.hero{padding:20px;gap:14px}.hero.ok{background:var(--okbg)}.hero.no{background:var(--dgbg)}
.hero h2{font-size:20px;line-height:24px}
.dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.hero.ok .dot{background:var(--on)}.hero.no .dot{background:var(--dg)}
.btn{background:var(--btn);color:#fff;border-radius:8px;padding:12px 20px;font-weight:500;width:100%;text-align:center}
.btn:active{background:#2352C9}
.btn.out{background:var(--bg2);color:var(--ac);box-shadow:inset 0 0 0 1px var(--line)}
.btn.out:active{background:var(--secp)}
.btn.link{background:none;color:var(--t3);padding:8px;font-weight:400}
.badge{border-radius:100px;padding:3px 10px;font-size:13px;line-height:18px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-dg{background:var(--dgbg);color:var(--dg)}.b-ac{background:var(--sec);color:var(--ac)}.b-ter{background:var(--ter);color:var(--t3)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px}
.bars i{flex:1;border-radius:3px;background:var(--ac);min-height:4px}.bars i.x{background:var(--line)}
.pair{flex:1;height:100%;display:flex;align-items:flex-end;gap:1px}.pair i{flex:1;border-radius:2px;background:var(--ac);min-height:3px}.pair i.h{background:var(--t4)}
.axis{display:flex;justify-content:space-between;color:var(--t3);font-size:13px}
.ev{display:flex;gap:12px}.ev time{width:44px;flex:none;color:var(--t3)}
.seg{display:flex;gap:4px;padding:4px;background:var(--ter);border-radius:10px}
.seg button,.chip{padding:8px;border-radius:8px;flex:1;color:var(--t2)}
.seg button[aria-pressed=true]{background:var(--bg2);color:var(--t1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{flex:none;border-radius:100px;padding:8px 12px;background:var(--bg2);font-size:13px}
.chip[aria-pressed=true]{background:var(--btn);color:#fff}
.leg{display:flex;gap:16px;color:var(--t2);font-size:13px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.week{display:flex;gap:8px;align-items:flex-end;height:150px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:13px;height:100%}
.week i{width:100%;border-radius:6px;background:var(--secp)}
.pill{background:var(--bg);border-radius:8px;padding:10px 12px}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.step{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:36%;background:var(--ac)}
.sig{display:flex;gap:6px;align-items:flex-end}.sig i{width:18px;border-radius:4px;background:var(--ac)}.sig i.x{background:var(--line)}
.sw{width:51px;height:31px;border-radius:100px;background:var(--off);padding:2px;display:flex;flex:none;transition:background .15s}
.sw::after{content:"";width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--on)}.sw[aria-checked=true]::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--ac)}
.field{display:flex;gap:12px;padding-top:10px;border-top:1px solid var(--line)}.field span:first-child{width:110px;flex:none;color:var(--t2)}
nav{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font-size:13px;line-height:18px;color:var(--t3)}
nav button[aria-current=page]{color:var(--ac)}
.i{flex:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="phone">
  <header class="top">
    <div class="bar"><svg width="28" height="28"><use href="#em"/></svg><b>LifeCare</b><button class="th" id="thBtn" aria-label="Сменить тему"></button><button class="av" id="avBtn" data-a="go" data-v="prof" aria-label="Профиль и настройки">М</button></div>
    <div><h1 id="ttl"></h1><p class="sub" id="sub"></p></div>
  </header>
  <main id="view"></main>

<script>
const P={home:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',act:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',notes:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',dev:'<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>',check:'<polyline points="20 6 9 17 4 12"/>',alert:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',sun:'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'};
const I=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const S={tab:'home',ok:true,seg:'day',flt:'all',tg:{dev:1,abs:1,conn:1,week:0}};
const today=[2,1,1,1,1,2,6,18,35,48,40,30,22,38,55,50,42,36,30,22,14,8,4,2],habit=[2,1,1,1,1,3,8,20,34,44,42,34,26,36,48,50,44,38,32,24,16,10,5,2];
const bars=(n)=>`<div class="bars">${today.map((v,i)=>`<i class="${i>n?'x':''}" style="height:${i>n?3:v/60*100}%"></i>`).join('')}</div><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>`;
const T={home:['Главная','Всё ли в порядке?'],act:['Активность','Как прошёл день?'],notes:['Уведомления','На что обратить внимание?'],dev:['Устройство','Устройство и настройка'],prof:['Профиль','Профиль и настройки']};
const N=[['Длительное отсутствие активности','Высокий','b-dg','dg','alert','high','За установленный период (4 часа) активность не обнаружена.','Вчера, 14:10','Позвоните Анне Петровне и убедитесь, что всё в порядке.','Позвонить','Всё в порядке'],
['Активность ниже обычной','Предупреждение','b-ter','dg','act','high','Пятница: 70% от привычного уровня активности для этого дня.','Пт, 18:00','Откройте сводку дня и сравните с привычным режимом.','Открыть сводку'],
['Устройство потеряло связь','Технический','b-ac','ac','dev','tech','Устройство не передаёт данные с 14:30.','Сегодня, 14:35','Проверьте питание модуля, Wi-Fi и соединение.','Проверить устройство'],
['Нестабильные данные','Технический','b-ac','ac','dev','tech','Качество сигнала недостаточно для надёжной оценки активности.','Сб, 09:20','Проверьте размещение модуля относительно роутера.','Подсказки по размещению'],
['Недельная сводка','Информационный','b-ter','t3','info','info','Активность за неделю отличалась от привычной в два дня.','Пн, 09:00','Просмотрите динамику по дням.','Открыть неделю']];
const tgl=(k,l,d)=>`<div class="row"><div class="grow"><div>${l}</div><div class="mut sm">${d}</div></div><button class="sw" role="switch" aria-checked="${!!S.tg[k]}" aria-label="${l}" data-a="tg" data-v="${k}"></button></div>`;
const V={
home(){const o=S.ok;return `<section class="card hero ${o?'ok':'no'}"><div class="row"><span class="dot">${I(o?'check':'alert',24)}</span><h2 class="grow ${o?'ok':'dg'}">${o?'Всё в порядке':'Нет актуальных данных'}</h2></div><p>${o?'Активность в пределах привычного режима. Последнее движение зафиксировано в 18:31.':'Устройство не передаёт данные с 14:30, поэтому мы не можем оценить состояние. Позвоните Анне Петровне и проверьте устройство.'}</p><button class="btn" data-a="go" data-v="${o?'act':'dev'}">${o?'Посмотреть день':'Проверить устройство'}</button></section>
<div class="g2"><div class="card" style="gap:4px"><span class="mut sm">Устройство</span><span class="big ${o?'ok':'dg'}">${o?'В сети':'Не в сети'}</span><span class="sec sm">${o?'Сигнал хороший':'Нет данных с 14:30'}</span></div><div class="card" style="gap:4px"><span class="mut sm">Активность</span><span class="big ${o?'':'sec'}">${o?'92%':'—'}</span><span class="sec sm">${o?'от привычной':'Оценка недоступна'}</span></div></div>
<div class="card row"><div class="grow"><div class="mut sm">Предупреждения</div><div class="${o?'':'dg'}">${o?'Активных нет':'Потеря связи с устройством'}</div></div><span class="big ${o?'':'dg'}">${o?0:1}</span></div>
<section class="card"><div class="row"><div class="grow"><h2>Активность сегодня</h2><div class="mut sm">${o?'Сравнение с привычным режимом':'Данные только до 14:30'}</div></div><span class="badge ${o?'b-ok':'b-dg'}">${o?'В норме':'Устарели'}</span></div>${bars(o?18:14)}</section>
<section class="card"><h2>Последние события</h2>${(o?[['18:31','Зафиксировано движение'],['16:05','Активность выше обычной'],['12:40','Период низкой активности — 1 ч 10 мин'],['08:15','Начало дневной активности']]:[['14:30','Устройство перестало передавать данные'],['14:22','Последнее движение зафиксировано'],['12:40','Период низкой активности — 1 ч 10 мин'],['08:15','Начало дневной активности']]).map(([t,s],i)=>`<div class="ev"><time class="${!o&&!i?'dg':''}">${t}</time><span>${s}</span></div>`).join('')}</section>
<button class="btn link sm" data-a="demo">Демо: переключить состояние</button>`},
act(){const d=S.seg==='day';return `<div class="seg" role="group" aria-label="Период"><button data-a="seg" data-v="day" aria-pressed="${d}">День</button><button data-a="seg" data-v="week" aria-pressed="${!d}">Неделя</button></div>`+(d?`<section class="card"><h2>Активность по часам</h2><div class="leg"><span><i style="background:var(--ac)"></i>Сегодня</span><span><i style="background:var(--t4)"></i>Привычный режим</span></div><div class="bars" style="height:160px">${today.map((v,i)=>`<div class="pair"><i class="${i>18?'x':''}" style="height:${i>18?2:v/60*100}%"></i><i class="h" style="height:${habit[i]/60*100}%"></i></div>`).join('')}</div><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div></section>
<section class="card"><h2>Периоды низкой активности</h2><div class="pill"><div>12:40 – 13:50 · 1 ч 10 мин</div><div class="mut sm">Чуть длиннее обычного</div></div><div class="pill"><div>02:00 – 06:00 · ночь</div><div class="mut sm">В пределах привычного</div></div><p class="ok">Итог дня: 92% от привычной активности</p></section>`:`<section class="card"><div><h2>Динамика за неделю</h2><div class="mut sm">Доля от привычной активности по дням</div></div><div class="week">${[['Пн',96],['Вт',101],['Ср',88],['Чт',93],['Пт',70],['Сб',92],['Вс',92]].map(([d,v])=>`<div><span class="${v<75?'dg':''}">${v}%</span><i style="height:${v*.8}px;${v<75?'background:var(--dg)':d==='Вс'?'background:var(--ac)':''}"></i><span class="sec">${d}</span></div>`).join('')}</div></section>`)},
notes(){const c={all:5,high:2,tech:2,info:1},l={all:'Все',high:'Важные',tech:'Технические',info:'Сводки'};return `<div class="chips">${Object.keys(l).map(k=>`<button class="chip" data-a="flt" data-v="${k}" aria-pressed="${S.flt===k}">${l[k]} · ${c[k]}</button>`).join('')}</div>`+N.filter(n=>S.flt==='all'||n[5]===S.flt).map((n,i)=>`<article class="card"><div class="row" style="align-items:flex-start"><span class="ic ${n[2]}" style="color:var(--${n[3]})">${I(n[4],22)}</span><div class="grow"><h2>${n[0]}</h2><div class="row" style="gap:8px;margin-top:4px"><span class="badge ${n[2]}">${n[1]}</span><span class="sec sm">${n[7]}</span></div></div></div><p>Причина: ${n[6]}</p><p class="mut">Что сделать: ${n[8]}</p><div class="row"><button class="btn" data-a="go" data-v="${n[5]==='tech'?'dev':'act'}">${n[9]}</button>${n[10]?`<button class="btn out">${n[10]}</button>`:''}</div></article>`).join('')},
dev(){const st=[['Питание модуля','Подключено по USB-C'],['Подключение к Wi-Fi 2,4 ГГц','Сеть: Home-2.4G'],['Передача данных','Последний пакет получен 2 мин назад'],['Качество сигнала','Достаточное для оценки активности']];return `<section class="card"><div class="row"><div class="grow"><h2>Статус подключения</h2><div class="mut sm">Проверка выполняется автоматически</div></div><span class="badge b-ok">В сети</span></div><div>${st.map(s=>`<div class="step"><span class="mark b-ok">${I('check',14)}</span><div><div>${s[0]}</div><div class="mut sm">${s[1]}</div></div></div>`).join('')}<div class="step"><span class="mark b-ac">${I('clock',14)}</span><div><div>Калибровка</div><div class="mut sm">Идёт формирование профиля привычной активности</div></div></div></div><div class="row mut"><span class="grow">Профиль активности</span><span style="color:var(--t1)">День 5 из ~14</span></div><div class="prog" role="progressbar" aria-valuenow="36" aria-valuemin="0" aria-valuemax="100"><i></i></div><p class="sec sm">До завершения калибровки уведомления об отклонениях не отправляются — только сводки и технические уведомления. Срок в 14 дней — проверяемая гипотеза.</p></section>
<section class="card"><div class="row"><h2 class="grow">Качество сигнала</h2><span class="badge b-ok">Хорошее</span></div><div class="sig"><i style="height:14px"></i><i style="height:23px"></i><i style="height:32px"></i><i style="height:41px"></i><i class="x" style="height:50px"></i></div><p class="mut sm">Модуль стабильно получает данные от роутера. Обрывы связи за последние 24 часа: 0.</p></section>
<section class="card"><h2>Размещение модуля</h2><p>Поставьте модуль в комнате, где человек проводит больше всего времени.</p><p>Держите его вдали от металлических поверхностей и микроволновки.</p><p>Не переставляйте модуль после калибровки — иначе потребуется повторная.</p></section>
<section class="card"><h2>Если устройство не подключается</h2><div class="pill"><div>Включите 2,4 ГГц</div><div class="mut sm">Модуль работает только в диапазоне 2,4 ГГц. Если сети объединены под одним именем, выделите отдельную.</div></div><div class="pill"><div>Проверьте защиту сети</div><div class="mut sm">Для первых тестов рекомендуем WPA2-Personal.</div></div><div class="pill"><div>Проверьте питание</div><div class="mut sm">Убедитесь, что кабель USB-C надёжно подключён к блоку питания.</div></div></section>`},
prof(){const sl=(l,v,m,x,u)=>`<label class="card" style="padding:0;background:none;gap:6px"><span class="row"><span class="grow">${l}</span><output class="${'ok'===0?'':''}" style="color:var(--ac)">${v}${u}</output></span><input type="range" min="${m}" max="${x}" value="${v}" data-u="${u}"></label>`;return `<section class="card"><h2>Подопечный</h2><div class="row"><span class="av" style="display:grid;place-items:center;width:48px;height:48px">А</span><div><div>Анна Петровна</div><div class="mut sm">Проживает одна</div></div></div><div class="field"><span>Домашний Wi-Fi</span><span>Home-2.4G</span></div><div class="field"><span>Модуль</span><span>LifeCare ESP32-S3</span></div><div class="field"><span>Заметки</span><span>Лекарства и медицинские данные — в следующих версиях</span></div></section>
<section class="card"><h2>Контакты родственников</h2><div class="pill row"><span class="av" style="display:grid;place-items:center">М</span><div class="grow"><div>Мария</div><div class="mut sm">Дочь · основной контакт</div></div></div><div class="pill row"><span class="av" style="display:grid;place-items:center">С</span><div class="grow"><div>Сергей</div><div class="mut sm">Сын</div></div></div><button class="btn out" style="display:flex;gap:8px;justify-content:center;align-items:center">${I('plus',16)}Добавить контакт</button></section>
<section class="card"><h2>Какие уведомления получать</h2>${tgl('dev','Отклонение от привычного режима','Сегодня активность ниже обычной')}${tgl('abs','Длительное отсутствие активности','Высокий приоритет')}${tgl('conn','Потеря связи с устройством','Технические')}${tgl('week','Недельная сводка','По понедельникам в 09:00')}</section>
<section class="card"><h2>Пороговые значения</h2>${sl('Период без активности до предупреждения',4,1,12,' ч')}<label class="card" style="padding:0;background:none;gap:6px"><span class="row"><span class="grow">Чувствительность к отклонениям</span><output style="color:var(--ac)">Средняя</output></span><input type="range" min="1" max="3" value="2" data-names="Низкая,Средняя,Высокая"></label></section>
<section class="card"><h2>Доступ к данным</h2><div class="row"><span class="grow">Мария</span><span class="badge b-ter">Владелец</span></div><div class="row"><span class="grow">Сергей</span><span class="badge b-ter">Только просмотр</span></div><p class="sec sm">Данные видят только приглашённые родственники. Владелец может отозвать доступ в любой момент.</p></section>`}};
function render(){const t=S.tab;document.getElementById('ttl').textContent=T[t][1];document.getElementById('sub').textContent=t==='home'?'Анна Петровна · обновлено сегодня в '+(S.ok?'18:42':'14:30'):t==='act'?'Анна Петровна · воскресенье, 18 октября':'Анна Петровна';const v=document.getElementById('view');v.innerHTML=V[t]();v.scrollTop=0;
document.getElementById('tabs').innerHTML=['home','act','notes','dev'].map(k=>`<button data-a="go" data-v="${k}" ${k===t?'aria-current="page"':''}>${I(k,24)}${T[k][0]}</button>`).join('');
document.getElementById('avBtn').toggleAttribute('aria-current',t==='prof');if(t==='prof')document.getElementById('avBtn').setAttribute('aria-current','page');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,keep=document.getElementById('view').scrollTop;
if(a==='go')S.tab=v;else if(a==='seg')S.seg=v;else if(a==='flt')S.flt=v;else if(a==='tg')S.tg[v]=S.tg[v]?0:1;else if(a==='demo')S.ok=!S.ok;
render();if(a!=='go')document.getElementById('view').scrollTop=keep;});
document.addEventListener('input',e=>{const r=e.target;if(r.type!=='range')return;const o=r.parentNode.querySelector('output');o.textContent=r.dataset.names?r.dataset.names.split(',')[r.value-1]:r.value+(r.dataset.u||'');});
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':mq.matches;
function paintTh(){const d=isDark(),b=document.getElementById('thBtn');b.innerHTML=I(d?'sun':'moon',20);b.setAttribute('aria-label',d?'Включить светлую тему':'Включить тёмную тему');}
try{const s=localStorage.getItem('lc-theme');if(s)root.dataset.theme=s;}catch(e){}
document.getElementById('thBtn').addEventListener('click',()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('lc-theme',n)}catch(e){}paintTh();});
mq.addEventListener('change',paintTh);
paintTh();render();
</script>
</body>
</html>
